syntax = "proto3";

package idl;

message UserProfile {
  int64 id = 1;
  optional string phone = 2;
  optional string email = 3;
  string level = 4;
}

message LearningStats {
  int32 total_sentences_learned = 1;
  int32 total_videos_completed = 2;
  int32 study_duration_minutes = 3;
  int32 current_streak_days = 4;
}
