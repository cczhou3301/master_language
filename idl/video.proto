syntax = "proto3";

package idl;

message VideoCard {
  int64 id = 1;
  string external_id = 2;
  string title_en = 3;
  optional string title_zh = 4;
  string thumbnail_url = 5;
  int32 duration_seconds = 6;
  int32 difficulty = 7;
  string accent = 8;
  string topic = 9;
  bool completed = 10;
}

message VideoFeedQuery {
  optional int32 difficulty = 1;
  optional string accent = 2;
  optional string topic = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message SubtitleLineSchema {
  int64 id = 1;
  int32 start_ms = 2;
  int32 end_ms = 3;
  string language = 4;
  string content = 5;
}

message VideoDetail {
  int64 id = 1;
  string external_id = 2;
  string title_en = 3;
  optional string title_zh = 4;
  string thumbnail_url = 5;
  int32 duration_seconds = 6;
  int32 difficulty = 7;
  string accent = 8;
  string topic = 9;
  repeated SubtitleLineSchema subtitle_lines = 10;
}
