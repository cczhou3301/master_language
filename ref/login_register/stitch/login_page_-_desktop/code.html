<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login Page - Master English!</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brand: "#3B82F6",
              "background-light": "#F8FAFC",
              "background-dark": "#0F172A",
            },
            fontFamily: {
              display: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "12px",
            },
          },
        },
      };
    </script>
<style type="text/tailwindcss">
      body {
        font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .gradient-btn {
        background: linear-gradient(90deg, #b2f5ea 0%, #fbb6ce 100%);
      }
      :root {
        --brand-gradient: linear-gradient(90deg, #b2f5ea 0%, #fbb6ce 100%);
      }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center p-4 transition-colors duration-200">
<button class="fixed top-6 right-6 p-2 rounded-full bg-white dark:bg-slate-800 shadow-lg text-slate-600 dark:text-slate-300 hover:scale-110 transition-transform" onclick="document.documentElement.classList.toggle('dark')">
<span class="material-symbols-outlined">dark_mode</span>
</button>
<div class="w-full max-w-[440px] bg-white dark:bg-slate-900 shadow-2xl shadow-slate-200/50 dark:shadow-none rounded-3xl p-8 md:p-12">
<div class="flex flex-col items-center mb-10">
<div class="w-16 h-16 bg-brand rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/30 mb-6">
<span class="material-symbols-outlined text-white text-4xl">school</span>
</div>
<h1 class="text-3xl font-bold text-slate-800 dark:text-white mb-2 tracking-tight">Master English!</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm">专业英语口语学习平台</p>
</div>
<div class="hidden mb-6 p-4 bg-red-50 dark:bg-red-900/20 border border-red-100 dark:border-red-900/30 rounded-xl" id="alertBox">
<p class="text-red-600 dark:text-red-400 text-sm leading-relaxed">
                您的账号已在多台设备上登录，已达上限。请先退出其他设备后再登录。
            </p>
</div>
<form class="space-y-6">
<div>
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2" for="username">手机号或邮箱</label>
<div class="relative">
<input class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-teal-200 dark:focus:ring-teal-900 focus:border-teal-400 dark:focus:border-teal-600 outline-none transition-all text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500" id="username" name="username" placeholder="请输入手机号或电子邮箱" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2" for="password">密码</label>
<div class="relative">
<input class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-teal-200 dark:focus:ring-teal-900 focus:border-teal-400 dark:focus:border-teal-600 outline-none transition-all text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500" id="password" name="password" placeholder="请输入密码" type="password"/>
</div>
</div>
<button class="gradient-btn w-full py-4 rounded-xl text-slate-800 font-bold text-lg shadow-md hover:shadow-lg hover:opacity-90 transition-all active:scale-[0.98] mt-2" type="button">
                登录
            </button>
</form>
<div class="mt-10 pt-8 border-t border-slate-100 dark:border-slate-800 text-center">
<p class="text-slate-500 dark:text-slate-400 text-sm">
                还没有账户？ 
                <a class="text-blue-600 dark:text-blue-400 font-semibold hover:underline ml-1" href="#">立即注册</a>
</p>
</div>
</div>
<div class="fixed bottom-6 text-center text-slate-400 dark:text-slate-500 text-xs px-4">
<p>没有激活码，请联系微信：<span class="font-medium text-slate-600 dark:text-slate-400">masterLanguage</span></p>
</div>

</body></html>
